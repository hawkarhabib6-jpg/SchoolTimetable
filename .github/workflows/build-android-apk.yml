name: Build Android APK (Business Card Maker)

on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'business-card-maker/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

# A newer commit supersedes an in-flight build, so two runs never race to
# replace the same release.
concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  # Needed to publish the APK as a release asset.
  contents: write

defaults:
  run:
    working-directory: business-card-maker

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        # React 19 is newer than some libraries declare, so peer ranges are relaxed.
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        # The Expo template signs release builds with the bundled debug keystore,
        # so this produces an installable APK without any signing secrets.
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/business-card-maker-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-card-maker-apk
          path: business-card-maker/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Releases
        # A rolling release keeps one permanent download link that works on a
        # phone without signing in to GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## دروستکەری بزنس کارت — وەشانی ئەندرۆید

          فایلی `.apk` ی خوارەوە دابگرە و لەسەر مۆبایلەکەت دایبمەزرێنە.
          لە کاتی دامەزراندندا ئەندرۆید ئاگادارت دەکاتەوە کە سەرچاوەکە نەناسراوە —
          **Install anyway** هەڵبژێرە.

          ---

          Android build of the Business Card Maker app. Signed with the Expo
          debug keystore: fine for personal use and testing, not for Google Play.
          NOTES
          gh release delete bcm-latest --yes --cleanup-tag || true
          gh release create bcm-latest dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Business Card Maker — APK" \
            --notes-file release-notes.md
